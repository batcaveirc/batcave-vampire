name: BatCave Vampire Bot

on:
  push:
    branches: [ main ]
  schedule:
    # Every 5 minutes: if the previous run has ended, start a fresh one.
    # Every 30 minutes, not every 5.
    #
    # The jobs last 350 minutes, so the cron only has to notice that one ENDED
    # — checking six times an hour to catch an event that happens every six
    # hours produced 37 run records a day, nearly all of them cancelled the
    # moment they were created. That churn is the visible part of "this
    # repository is hosting a service", and the account running the standby
    # fleet was suspended for exactly that pattern at six times this volume.
    #
    # The cost is a restart gap of up to 30 minutes if a bot dies early. That
    # is the right trade against losing the account entirely.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

# One instance at a time. cancel-in-progress:false means the 5-minute cron
# does NOT kill a running bot — the new run waits and only takes over once the
# current one hits its timeout (below). That gives continuous coverage with a
# short handoff roughly every ~5.8 hours instead of a restart every 5 minutes.
concurrency:
  group: batcave-bot
  # A PUSH takes over immediately; the 5-minute cron still waits its turn.
  #
  # With this flat false, every fix queued behind a job that keeps its own code
  # for its whole 350-minute life. Measured today: a bot 5h37m old was still
  # kicking people for a Hindi idiom and refusing to voice a registered regular
  # while four commits fixing exactly those sat pending. Repeatedly reported as
  # "fixed and pushed" when nothing had changed in the room — the deploy is
  # part of the change, and this is what made that true here.
  #
  # The cron must NOT cancel, or a bot restarts every five minutes forever.
  # The distinction is the event, so the expression is the event.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # just under GitHub's 6-hour hard cap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run the Vampire
        env:
          # ── Secrets: only these three actually need to be secret ──────────
          NICKSERV_PASS: ${{ secrets.NICKSERV_PASS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 || secrets.GROQ_API_KEY1 }}

          # ── Config: plain defaults, so a missing secret can never stop the
          #    bot. Set the matching repo secret only to override one. ───────
          IRC_SERVER: ${{ secrets.IRC_SERVER || 'irc.hybridirc.com' }}
          IRC_PORT: ${{ secrets.IRC_PORT || '6697' }}
          IRC_TLS: ${{ secrets.IRC_TLS || 'on' }}
          IRC_NICK: ${{ secrets.IRC_NICK || 'Dracula' }}
          # Both rooms: Dracula is the primary moderator in each. Luna covers
          # the gaps in the same two rooms and relays only the emoji one.
          IRC_CHANNEL: ${{ secrets.IRC_CHANNEL || '#batcave,#🅱🅰🆃🅲🅰🆅🅴' }}
          IRC_REALNAME: ${{ secrets.IRC_REALNAME || 'Older than the room, and in no hurry' }}
          NICKSERV_ACCOUNT: ${{ secrets.NICKSERV_ACCOUNT }}

          # Owners get every command. Admins get the moderation subset; leaving
          # ADMINS empty is fine when everyone is listed in OWNERS.
          OWNERS: ${{ secrets.OWNERS }}
          ADMINS: ${{ secrets.ADMINS }}
          WHITELIST: ${{ secrets.WHITELIST }}
          # Names subtracted from WHITELIST. Removing somebody otherwise means
          # rewriting a secret you cannot read; this needs no knowledge of it.
          UNTRUST: ${{ secrets.UNTRUST }}
          # Where trust actually LIVES once set: a registered channel whose
          # ChanServ access list is the whitelist. Editable from the room with
          # !!trust, survives restarts, and readable — which a secret is not.
          # Empty or unregistered and the two secrets above hold, unchanged.
          TRUST_CHANNEL: ${{ secrets.TRUST_CHANNEL }}
          # The realname our own decorative bots carry, so they can be spotted
          # in the open room and invited into the locked one without ever
          # having to speak. Unset = the feature is off.
          CHORUS_MARK: ${{ secrets.CHORUS_MARK }}
          # The open room. Read in three places — the WHO sweep, the foyer text
          # in a room's topic, and which room counts as the way in — and it was
          # never passed, so all three fell back to empty. The worst of those is
          # the topic: with no open room known, the OPEN room would have been
          # signposted "Invite-only", which is the opposite of true.
          CHORUS_CHANNEL: ${{ secrets.CHORUS_CHANNEL }}
          # Our own standbys, which do NOT rotate their nicks and wear a
          # different realname from the scenery. Without this they are refused
          # by the realname test and sit outside a +i #batcave — locked out of
          # the room they exist to defend, unable to ask, and with no +I
          # exception that fits an unregistered bot.
          # MUST match the standby matrix. Drusilla is NOT on it — commit
          # c6e0653 replaced her with Bankai — so listing her here would
          # have invited whoever happens to be wearing that unregistered
          # nick into the locked room, on this bot's own authority.
          FLEET_NICKS: ${{ secrets.FLEET_NICKS || 'Carmilla,Bankai,Katerina' }}
          TRUST_FLAG: ${{ secrets.TRUST_FLAG || 'V' }}
          # Standing that follows behaviour. Off makes trust manual again.
          AUTO_TRUST: ${{ secrets.AUTO_TRUST || 'on' }}
          TRUST_EARN_DAYS: ${{ secrets.TRUST_EARN_DAYS || '30' }}
          TRUST_EARN_MESSAGES: ${{ secrets.TRUST_EARN_MESSAGES || '40' }}
          TRUST_LOSE_STRIKES: ${{ secrets.TRUST_LOSE_STRIKES || '3' }}
          # Two regulars fighting: how long each is quiet, and how much longer
          # the one who started it is quiet for.
          FEUD_DEVOICE_MIN: ${{ secrets.FEUD_DEVOICE_MIN || '2' }}
          FEUD_INSTIGATOR_BONUS: ${{ secrets.FEUD_INSTIGATOR_BONUS || '3' }}
          # How many people organising about us elsewhere before the door shuts.
          WATCH_LOCK_AT: ${{ secrets.WATCH_LOCK_AT || '3' }}
          WATCH_MUTE_MIN: ${{ secrets.WATCH_MUTE_MIN || '30' }}
          RECRUIT_PER_ROUND: ${{ secrets.RECRUIT_PER_ROUND || '3' }}
          # The SPARE Groq key. groqChat() already tries each key in turn, and
          # this secret has existed since 14 August — it was simply never passed
          # in, so the fallback the code was written around has never once been
          # available. With the primary key failing, this is the difference
          # between an AI layer and no AI layer.
          GROQ_API_KEY1: ${{ secrets.GROQ_API_KEY1 }}
          # Accepted alongside PEER_SECRET during a rotation, so changing the
          # shared secret is a fade rather than a cliff.
          PEER_SECRET_PREV: ${{ secrets.PEER_SECRET_PREV }}
          FUN_ON: ${{ secrets.FUN_ON || 'on' }}

          # ── Moderation tuning ────────────────────────────────────────────
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          GROQ_MODEL_FALLBACK: ${{ secrets.GROQ_MODEL_FALLBACK || 'openai/gpt-oss-120b' }}
          # Temporary ops for a whitelisted regular who is being targeted.
          # Early warning: listen in the recruiting rooms for our channel
          # being advertised, and meet a flagged arrival at the door.
          # Exit if the bot cannot hold a connection for this long, so the
          # queued run takes the slot instead of waiting behind a dead one.
          DOWN_EXIT_MIN: ${{ secrets.DOWN_EXIT_MIN || '12' }}
          # Proving the standby is ours without a services account. Never
          # trust the NAME alone — the nick is unregistered and anyone can
          # take it. No secret set means no recognition at all.
          PEER_SECRET: ${{ secrets.PEER_SECRET }}
          # MUST match the standby matrix in the renfield repo. Drusilla was
          # replaced by Bankai; leaving her here moderated our own bots.
          PEER_BOTS: ${{ secrets.PEER_BOTS || 'Carmilla,Bankai,Katerina' }}
          WATCH: ${{ secrets.WATCH || 'on' }}
          GUARDIAN: ${{ secrets.GUARDIAN || 'on' }}
          GUARDIAN_MINUTES: ${{ secrets.GUARDIAN_MINUTES || '10' }}
          RETORT: ${{ secrets.RETORT || 'on' }}
          # Second provider on a DIFFERENT daily meter. Dormant until set.
          # Other people's bots in the room — never a target, never invited.
          BOT_NICKS: ${{ secrets.BOT_NICKS || 'Almond' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.0-flash' }}
          AI_MAX_PER_DAY: ${{ secrets.AI_MAX_PER_DAY || '600' }}
          AI_MAX_PER_MIN: ${{ secrets.AI_MAX_PER_MIN || '12' }}
          SENTIENT_ON: ${{ secrets.SENTIENT_ON || 'on' }}
          # Trust ladder: staff/ops > whitelisted > registered > stranger
          WARN_LIMIT: ${{ secrets.WARN_LIMIT || '3' }}
          WARN_LIMIT_REGISTERED: ${{ secrets.WARN_LIMIT_REGISTERED || '1' }}
          KICK_UNREGISTERED: ${{ secrets.KICK_UNREGISTERED || 'on' }}
          AUTO_VOICE: ${{ secrets.AUTO_VOICE || 'on' }}
          # Voice anyone identified to services. A cloak changes between
          # sessions on this network; an account does not.
          AUTO_VOICE_REGISTERED: ${{ secrets.AUTO_VOICE_REGISTERED || 'on' }}
          QUIET_MINUTES: ${{ secrets.QUIET_MINUTES || '5' }}
          # Rooms on the voice ladder: +m, everyone voiced on arrival, and
          # losing the voice is the first consequence instead of a kick.
          MODERATED_ROOMS: ${{ secrets.MODERATED_ROOMS || '#batcave,#🅱🅰🆃🅲🅰🆅🅴' }}
          DEVOICE_MINUTES: ${{ secrets.DEVOICE_MINUTES || '2' }}
          LINK_FILTER: ${{ secrets.LINK_FILTER || 'off' }}
          BADWORDS: ${{ secrets.BADWORDS }}
          SEVERE_WORDS: ${{ secrets.SEVERE_WORDS }}
          RAID_GUARD: ${{ secrets.RAID_GUARD || 'on' }}
          RAID_JOINS: ${{ secrets.RAID_JOINS || '7' }}
          RAID_WINDOW_SEC: ${{ secrets.RAID_WINDOW_SEC || '10' }}
          # Slow-raid detector: hostile ARRIVALS, not join rate.
          RAID_HOSTILE_JOINS: ${{ secrets.RAID_HOSTILE_JOINS || '3' }}
          RAID_HOSTILE_WINDOW_MIN: ${{ secrets.RAID_HOSTILE_WINDOW_MIN || '5' }}
          RAID_LOCK_SEC: ${{ secrets.RAID_LOCK_SEC || '60' }}
          STRICT_NICKS: ${{ secrets.STRICT_NICKS || 'on' }}
          AUTOBAN_MASKS: ${{ secrets.AUTOBAN_MASKS }}
          # Hosts protected from other moderators' kicks (the whitelist is
          # protected automatically). Comma-separated globs.
          PROTECT_MASKS: ${{ secrets.PROTECT_MASKS }}
          # ── Earning trust by turning up ──────────────────────────────
          #
          # The original door needs 40 messages inside ONE run, and a run is
          # ~350 minutes, so an ordinary regular who says fifteen lines a day
          # never reaches it — measured: not one automatic promotion has ever
          # happened. The second door counts separate DAYS, reported by Luna out
          # of the Discord history, which is the only durable record of this room
          # that exists.
          #
          # TRUST_EARN_DAYS_SEEN  how many separate days make somebody a regular
          # TRUST_EARN_MIN_DAYS   how old their account must be for those to count
          #
          # The account floor is lower here than the 30 days the message door
          # uses, because the evidence is stronger: a week of separate days is a
          # week of patience, which is the expensive thing to fake. Both doors
          # still require a registered account and a clean record.
          TRUST_EARN_DAYS_SEEN: ${{ secrets.TRUST_EARN_DAYS_SEEN || '7' }}
          TRUST_EARN_MIN_DAYS: ${{ secrets.TRUST_EARN_MIN_DAYS || '7' }}
          # How often to knock on the door of a room we are supposed to be in
          # and are not. A moderator banned the account, kicked the bot, and
          # ChanBot lifted the ban four seconds later — the bot had already made
          # its single rejoin attempt and never came back.
          REJOIN_EVERY_SEC: ${{ secrets.REJOIN_EVERY_SEC || '60' }}
          # Mirror channel bans and invite exceptions into ChanServ's durable
          # lists. +b and +I live in the SERVER's memory for a channel, and a
          # channel exists only while somebody is in it — so emptying the room
          # or cycling the service loses every ban a moderator set, which is
          # what the owner reported. A +b becomes a permanent AKICK, a -b
          # removes it again, and a +I becomes FLAGS <mask> +i ("may invite
          # themselves"). Set to "off" to stop mirroring.
          BAN_PERSIST: ${{ secrets.BAN_PERSIST }}
          # ── Unknown and uninvited arrivals: OFF ─────────────────────
          #
          # Withholding voice on ARRIVAL judges somebody for turning up rather
          # than for anything they did. The owner watched it work as designed and
          # called it: "dracula keeps taking voice of new ppl that join the room i
          # think its not a good idea to keep that feature". It costs every
          # well-behaved newcomer's first impression to inconvenience the few who
          # were going to misbehave — and the ladder catches those a few seconds
          # later anyway, on evidence, the moment they say something.
          #
          # Set to "on" for a room under active attack, where that trade is worth
          # making for a while.
          HOLD_UNINVITED: ${{ secrets.HOLD_UNINVITED }}
          # How often the moderators get ONE line naming everybody currently
          # waiting for a voice. Routine holds no longer interrupt anybody: in a
          # room ChanBot voices everyone into, "an unknown person arrived" is the
          # normal case and a notice each is a flood moved from the channel into
          # their private windows. A guarded range or somebody already heard
          # misbehaving elsewhere still says so at once.
          HOLD_DIGEST_MIN: ${{ secrets.HOLD_DIGEST_MIN || '15' }}
          # Tell each held newcomer privately why they cannot speak. OFF, and
          # that default is the fix for the worst outage of this project: one
          # notice per arrival does not coalesce the way a MODE does, so sixty
          # arrivals queued sixty seconds of traffic at the rate the server
          # accepts — and every reply, every moderation line and every AI answer
          # sat behind it. The moderator digest already says who is waiting.
          HOLD_TELL_THEM: ${{ secrets.HOLD_TELL_THEM }}
          # Tell the moderators about a hold at all. OFF, on the owner's
          # instruction: "voicing a user any mod can do that they dont need to be
          # informed". An unvoiced newcomer is visible in the room, so the notice
          # reported something already on screen and cost a line of traffic each
          # time. Every hold is still in the log.
          HOLD_TELL_MODS: ${{ secrets.HOLD_TELL_MODS }}
          # The longest a reply is held back to look like typing. An instant
          # answer to everything is a tell no wording hides; five seconds is the
          # ceiling, not the usual wait. Set to 0 to answer as fast as the queue
          # allows.
          TYPING_MAX_MS: ${{ secrets.TYPING_MAX_MS || '5200' }}
          # How often the bot reports its own state: queue depth, when it last
          # heard anything, when it last managed to SEND anything, where it holds
          # ops. Twice the bot has been reported dead while the job looked healthy
          # and the log said nothing about any of that.
          HEARTBEAT_SEC: ${{ secrets.HEARTBEAT_SEC || '300' }}
          # Where a command's answer goes.
          #
          #   query   (default) a private message to whoever asked. Chosen on
          #                     EVIDENCE: the log shows every command answered
          #                     ([CMD] ... -> [TX] NOTICE ...) with no server
          #                     error of any kind, and the owner saw none of them.
          #                     The bot sent, the server accepted, the notices did
          #                     not land. A PRIVMSG is equally private and opens a
          #                     query window clients actually surface
          #   notice            a NOTICE, as before
          #   channel           in the room, visible to everybody
          CMD_REPLY: ${{ secrets.CMD_REPLY || 'notice' }}
          # The vhosts our own bots wear, comma separated. A vhost belongs to
          # the CONNECTION, not the nick — Dracula@Sat.Chit.Ananda and
          # Luna1@Keeping.The.Night.Company survive any rename — so this is the
          # one way of saying "one of ours" that a nick change cannot break.
          # Every other list here has been a list of NICKS and every one has
          # drifted: PEER_BOTS still named Drusilla weeks after Bankai replaced
          # her, so the bot moderated its own game dealer in front of the room.
          OUR_HOSTS: ${{ secrets.OUR_HOSTS || 'Sat.Chit.Ananda,Keeping.The.Night.Company,Got.My.Eyes.OnU' }}
          # Names the bot answers to besides the one it is wearing. The room
          # learns one name and keeps using it, so "hey dracula" has to work even
          # if it is currently called something else.
          ALSO_ANSWER_TO: ${{ secrets.ALSO_ANSWER_TO || 'Dracula' }}
          # Nicks never treated as offensive, whatever substring they contain.
          # ISHITA was kicked for containing s-h-i-t between an i and an a.
          NICK_ALLOW: ${{ secrets.NICK_ALLOW }}
          # ── Nick rotation ──────────────────────────────────────────────
          # ON by default and needs nothing set. With no NICK_POOL the bot builds
          # its own names — Dracula47 — so there is nothing to choose and nothing
          # to register with NickServ. The number is what makes that safe: a
          # numbered variant is almost certainly not REGISTERED to anybody, so
          # there is no enforcement to trip, and it still reads as obviously the
          # bot. NICK_ROTATE=0 turns it off. NICK_POOL is an optional override.
          # NICK_MAXLEN keeps a generated name inside the network's limit.
          #
          # The cap is the safety feature, not the interval: at most
          # NICK_MAX_PER_HOUR changes in any rolling hour, whatever the timer or
          # a bug in it asks for. Rapid renaming is read as flooding and killed
          # for, on a network that Z-lines ranges on sight.
          #
          # Rotation is abandoned while the room is locked down, when a name
          # comes back taken, when NickServ enforces a rename, and when the bot
          # is kicked — in all of those the useful thing is to be findable under
          # the name the room knows.
          NICK_ROTATE: ${{ secrets.NICK_ROTATE || '' }}
          NICK_POOL: ${{ secrets.NICK_POOL || '' }}
          NICK_ROTATE_MIN: ${{ secrets.NICK_ROTATE_MIN || '240' }}
          NICK_MAX_PER_HOUR: ${{ secrets.NICK_MAX_PER_HOUR || '1' }}
          NICK_MAXLEN: ${{ secrets.NICK_MAXLEN || '30' }}
          # Carrier tails this room recognises, comma separated — the honest form
          # of "be easy on Indian, US and UK users, hold the unknown countries".
          # We cannot see anybody's country: the network cloaks the address, so no
          # geolocation is possible. What the cloak keeps is its last two groups,
          # which name the CARRIER ("4900.2401.IP" is Reliance Jio) — so this is a
          # list of carriers, which also catches VPN exits, since a VPN endpoint is
          # a hosting provider no regular is on.
          #
          # EMPTY BY DEFAULT and that matters: with no list, nobody is treated as
          # foreign. An empty value must never mean "everyone is a stranger".
          HOME_HOSTS: ${{ secrets.HOME_HOSTS }}
          # Host tails that must be VOUCHED FOR — registered, trusted, or
          # invited — rather than banned. Empty by default: "4900.2401.IP" is
          # Reliance Jio, and this room's own king, deepak and Lucifer wear it,
          # so banning the tail would remove regulars to stop one attacker.
          # Set it deliberately, knowing that cost.
          GUARDED_HOSTS: ${{ secrets.GUARDED_HOSTS }}
          # Undoing another moderator's kick of a PERSON. OFF: a ban by a mod
          # stands, and nobody is invited back or unbanned.
          KICK_PROTECT: ${{ secrets.KICK_PROTECT }}
          # Undoing a kick or ban of OUR OWN BOTS. ON: anybody with @ could
          # otherwise take Luna or a standby out of the room permanently with
          # two commands, and a bot cannot ask to come back.
          FLEET_PROTECT: ${{ secrets.FLEET_PROTECT || 'on' }}
          # Trust that follows the HOST: a regular who changes nick needs one
          # entry here, not one per nick in WHITELIST.
          TRUSTED_MASKS: ${{ secrets.TRUSTED_MASKS }}
          CHANNEL_RULES: ${{ secrets.CHANNEL_RULES }}
          MOD_ENABLED: ${{ secrets.MOD_ENABLED || 'on' }}

          # ── Recruiting ───────────────────────────────────────────────────
          # Channels the OWNER runs, that Dracula may invite from. Empty = the
          # whole feature is off. Only list rooms you hold ops in.
          RECRUIT_CHANNELS: ${{ secrets.RECRUIT_CHANNELS }}
          # Which half of a room this bot invites: feminine | other | all.
          # 'all' while only one bot recruits — otherwise ~90% of every
          # source room is unreachable and it reports 'nobody eligible'.
          RECRUIT_TARGET: ${{ secrets.RECRUIT_TARGET || 'feminine' }}
          RECRUIT_REASK_DAYS: ${{ secrets.RECRUIT_REASK_DAYS || '21' }}
          RECRUIT_ON: ${{ secrets.RECRUIT_ON || 'off' }}
          # Long, random gaps. A metronome is what a bot looks like; these
          # numbers are what keep it looking like a person being friendly.
          # The first attempt after startup. Short on purpose: the host
          # restarts this bot every six hours and every restart resets the
          # timer, so a long first gap means it can never fire.
          RECRUIT_FIRST_MIN: ${{ secrets.RECRUIT_FIRST_MIN || '1' }}
          RECRUIT_MIN_GAP_MIN: ${{ secrets.RECRUIT_MIN_GAP_MIN || '20' }}
          RECRUIT_MAX_GAP_MIN: ${{ secrets.RECRUIT_MAX_GAP_MIN || '45' }}
          RECRUIT_ANNOUNCE_MIN: ${{ secrets.RECRUIT_ANNOUNCE_MIN || '240' }}
          FEMININE_HINTS: ${{ secrets.FEMININE_HINTS }}
          # Channel scrollback: InspIRCd chanhistory, lines:duration.
          CHANNEL_HISTORY_SPEC: ${{ secrets.CHANNEL_HISTORY_SPEC || '50:3d' }}

          # ── Findit game pacing (seconds unless noted) ────────────────────
          # Where FindIt runs. Its own room by default: the game borrows the
          # topic line for a scoreboard and quiets players as they are killed,
          # neither of which belongs in the room people are trying to chat in.
          FINDIT_ROOM: ${{ secrets.FINDIT_ROOM || '#batcave-games' }}
          FINDIT_LOBBY_SECS: ${{ secrets.FINDIT_LOBBY_SECS || '90' }}
          FINDIT_GRACE_SECS: ${{ secrets.FINDIT_GRACE_SECS || '60' }}
          FINDIT_KILL_CD: ${{ secrets.FINDIT_KILL_CD || '45' }}
          FINDIT_BREAK_CD: ${{ secrets.FINDIT_BREAK_CD || '90' }}
          FINDIT_CRITICAL_SECS: ${{ secrets.FINDIT_CRITICAL_SECS || '90' }}
          FINDIT_DISCUSS_SECS: ${{ secrets.FINDIT_DISCUSS_SECS || '90' }}
          FINDIT_VOTE_SECS: ${{ secrets.FINDIT_VOTE_SECS || '45' }}
          FINDIT_GAME_CD_MIN: ${{ secrets.FINDIT_GAME_CD_MIN || '10' }}
        run: node action-bot.js
